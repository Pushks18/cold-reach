version: '3.8'

services:
  # React dashboard served by nginx
  dashboard:
    build:
      context: ../coldreach-dashboard
      dockerfile: ../docker/Dockerfile.dashboard
    ports:
      - "80:80"
    depends_on:
      - companion
    restart: unless-stopped

  # Node.js companion server + Playwright
  companion:
    build:
      context: ../coldreach-companion
      dockerfile: ../docker/Dockerfile.companion
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - CHROME_PROFILE_PATH=/data/chrome-profile
      - OLLAMA_URL=http://ollama:11434
    env_file:
      - ../coldreach-companion/.env
    volumes:
      - chrome-profile:/data/chrome-profile
      - ../coldreach-companion/resumes:/app/resumes
      - ../coldreach-companion/profile.json:/app/profile.json:ro
      - screenshots:/app/screenshots
    depends_on:
      - ollama
    restart: unless-stopped

  # Local LLM for answering application questions
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    # After first start, run: docker exec coldreach-ollama-1 ollama pull llama3.2:3b

volumes:
  chrome-profile:
  ollama-data:
  screenshots:
